# Release signing for AMAYA ERP.
#
# This file is read by app/build.gradle. It is deliberately kept out of version
# control - anyone with these values can sign an update that the Play Store will
# accept as coming from you, so treat it as a secret. Losing this file (or the
# keystore beside it) means you can never publish an update to the existing
# listing; you would have to ship a new applicationId.
#
# Back up BOTH android/keystore.properties AND
# android/app/stockflow-release.keystore somewhere durable and private.
#
# WHY THE FILE AND ALIAS STILL SAY "stockflow"
# The applicationId was rebranded to com.amaya.industries.erp, but the keystore
# was not renamed, on purpose. A signing key is identity, not branding: it is
# the thing that proves every future build is the same app, and it is
# independent of the applicationId. Renaming the file or the alias buys nothing
# a user can see, and the risk of pointing a release build at the wrong key -
# or of a backup being restored under a name that no longer matches - is a
# broken update channel that cannot be repaired. If AMAYA is ever distributed
# under a different developer account, generate a fresh key then, and keep this
# one only for installs that already exist.

storeFile=stockflow-release.keystore
storePassword=stockflow-erp-2026
keyAlias=stockflow
keyPassword=stockflow-erp-2026
